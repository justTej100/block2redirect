<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block2Redirect Popup</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <h1>Block2Redirect</h1>

    <section class="dashboard-strip" aria-label="Today's progress">
        <div class="dash-item">
            <span class="dash-value" id="dashSolves">0</span>
            <span class="dash-label">Solves</span>
        </div>
        <div class="dash-item">
            <span class="dash-value" id="dashApps">0</span>
            <span class="dash-label">Apps</span>
        </div>
        <div class="dash-item">
            <span class="dash-value" id="dashCommits">0</span>
            <span class="dash-label">Commits</span>
        </div>
        <div class="dash-item dash-goal">
            <span class="dash-value" id="dashGoal">0/5</span>
            <span class="dash-label">App goal</span>
        </div>
    </section>
    <p id="followUpBanner" class="status-text" hidden></p>

    <h3>Block Site</h3>

    <div class="form">
        <input id="blockedSite" placeholder="Site to block (reddit.com)" aria-label="Blocked site domain">
        <div class="button-row">
            <button id="addBlockedSite" type="button">Add Blocked Site</button>
            <button id="blockCurrentSite" type="button" class="secondary">Block Current Site</button>
        </div>
    </div>

    <div id="statusMessage" class="status-text" aria-live="polite"></div>

    <ul id="blockedSitesList"></ul>

    <h3>Toolkit</h3>
    <div class="button-row">
        <button id="pushLastSolve" type="button" class="secondary">Push last solve</button>
        <button id="saveThisJob" type="button" class="secondary">Save this job</button>
    </div>

    <button id="settingsButton" class="settings-button" aria-label="Settings" title="Settings">⚙️</button>

    <script src="../util/constants.js"></script>
    <script src="../util/helpers.js"></script>
    <script src="../util/storage.js"></script>
    <script src="../util/validation.js"></script>
    <script src="popup.js"></script>
</body>
</html>
