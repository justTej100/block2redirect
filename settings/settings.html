<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Block2Redirect Settings</title>
	<link rel="stylesheet" href="settings.css">
</head>

<body class="settings-page">
	<header class="settings-header">
		<h1>Settings</h1>
	</header>

	<div class="settings-container">
		<div class="panel blocked-sites-panel">
			<h3>Blocked Sites</h3>
			<div class="row">
				<input id="blockedSiteInput" placeholder="reddit.com" aria-label="Blocked site domain">
				<button id="addBlockedBtn">Add</button>
			</div>
			<ul id="blockedSitesList" class="sites-grid"></ul>
		</div>

		<div class="panel productive-sites-panel">
			<h3>Productive Sites</h3>
			<div class="row">
				<input id="productiveSiteInput" placeholder="https://developer.mozilla.org" aria-label="Productive site URL">
				<button id="addProductiveBtn">Add</button>
			</div>
			<ul id="productiveSitesList" class="sites-grid"></ul>
		</div>

		<div class="panel site-mappings-panel">
			<h3>Site Mappings</h3>
			<ul id="mappingList" class="mappings-list"></ul>
		</div>

		<div class="panel modes-panel">
			<h3>Modes</h3>
			<div class="modes-grid">
				<label class="toggle-label">
					<input type="checkbox" id="focusToggle">
					<span class="toggle-slider"></span>
					<span>Focus</span>
				</label>
				<label class="toggle-label">
					<input type="checkbox" id="randomToggle">
					<span class="toggle-slider"></span>
					<span>Random</span>
				</label>
				<label class="toggle-label">
					<input type="checkbox" id="punishToggle">
					<span class="toggle-slider"></span>
					<span>Punish</span>
				</label>
				<label class="toggle-label">
					<input type="checkbox" id="timerToggle">
					<span class="toggle-slider"></span>
					<span>Timer</span>
				</label>
			</div>
			<div class="row compact">
				<input type="number" id="punishThresholdInput" min="1" placeholder="Punish threshold" aria-label="Punishment threshold">
				<button id="saveThresholdBtn">Save</button>
			</div>
			<div class="row compact">
				<select id="defaultProductiveSelect" aria-label="Default productive site"></select>
				<button id="saveDefaultBtn">Default</button>
			</div>
		</div>

		<div class="panel timer-panel">
			<h3>Timer</h3>
			<div class="row compact">
				<input type="number" id="workMinutesInput" min="1" placeholder="Work" aria-label="Work minutes">
				<input type="number" id="breakMinutesInput" min="1" placeholder="Break" aria-label="Break minutes">
				<button id="saveSessionConfigBtn">Save</button>
			</div>
			<div class="row compact">
				<button id="startSessionBtn">Start</button>
				<button id="stopSessionBtn" class="danger">Stop</button>
			</div>
			<p id="sessionStatus" class="status-text">Session inactive</p>
		</div>

		<div class="panel stats-panel">
			<h3>Blocked Attempts</h3>
			<ul id="statsList" class="stats-list"></ul>
		</div>

		<div class="panel github-panel">
			<h3>GitHub Sync</h3>
			<p id="githubStatus" class="status-text">Not connected</p>
			<div class="row compact">
				<input id="githubClientIdInput" type="text" placeholder="OAuth client ID" aria-label="GitHub OAuth client ID" autocomplete="off">
				<button id="githubClientIdSaveBtn" type="button">Save</button>
			</div>
			<div class="row compact">
				<button id="githubConnectBtn" type="button">Connect</button>
				<button id="githubDisconnectBtn" type="button" class="danger">Disconnect</button>
			</div>
			<p id="githubDeviceHint" class="status-text" hidden></p>
			<div class="row compact">
				<select id="githubRepoSelect" aria-label="GitHub repository"></select>
				<button id="githubRefreshReposBtn" type="button" class="secondary">↻</button>
			</div>
			<div class="row compact">
				<input id="githubNewRepoInput" placeholder="new-repo" aria-label="New repo name">
				<button id="githubCreateRepoBtn" type="button">Create</button>
			</div>
			<label class="toggle-label">
				<input type="checkbox" id="githubAutoPushToggle" checked>
				<span class="toggle-slider"></span>
				<span>Auto-push</span>
			</label>
			<div class="row compact">
				<input id="cfHandleInput" placeholder="CF handle" aria-label="Codeforces handle">
				<button id="cfHandleSaveBtn" type="button">Save</button>
			</div>
		</div>

		<div class="panel sheets-panel">
			<h3>Job Tracker</h3>
			<p id="sheetsStatus" class="status-text">Not connected</p>
			<div class="row compact">
				<input id="googleClientIdInput" type="text" placeholder="Google OAuth client ID" aria-label="Google OAuth client ID" autocomplete="off">
				<button id="googleClientIdSaveBtn" type="button">Save</button>
			</div>
			<div class="row compact">
				<button id="googleConnectBtn" type="button">Connect</button>
				<button id="googleDisconnectBtn" type="button" class="danger">Disconnect</button>
			</div>
			<div class="row compact">
				<input id="sheetUrlInput" placeholder="Sheet URL" aria-label="Google Sheet URL">
				<button id="sheetLinkBtn" type="button">Link</button>
			</div>
			<div class="row compact">
				<input type="number" id="jobGoalInput" min="1" placeholder="Daily goal" aria-label="Daily application goal">
				<button id="jobGoalSaveBtn" type="button">Goal</button>
			</div>
		</div>
	</div>

	<script src="../util/constants.js"></script>
	<script src="../util/helpers.js"></script>
	<script src="../util/storage.js"></script>
	<script src="../util/validation.js"></script>
	<script src="settings.js"></script>
</body>
</html>
